<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">MoneyPrinter#</title>
  <desc id="desc">A geometric M and hash mark representing repeatable video production.</desc>
  <defs>
    <linearGradient id="mp-bg" x1="64" y1="38" x2="448" y2="478" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D2B45"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#080D16"/>
    </linearGradient>
    <linearGradient id="mp-mark" x1="142" y1="182" x2="334" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8CF7C7"/>
      <stop offset="0.52" stop-color="#4EDAE7"/>
      <stop offset="1" stop-color="#FFC857"/>
    </linearGradient>
    <pattern id="mp-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#B7C7DF" stroke-opacity="0.11" stroke-width="1"/>
    </pattern>
    <filter id="mp-shadow" x="-25%" y="-25%" width="150%" height="165%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#mp-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#mp-grid)"/>
  <rect x="17" y="17" width="478" height="478" rx="111" fill="none" stroke="#D7E4F7" stroke-opacity="0.16" stroke-width="2"/>

  <g filter="url(#mp-shadow)">
    <rect x="110" y="112" width="292" height="288" rx="42" fill="#09111E" stroke="#D7E4F7" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M148 166H364" stroke="#D7E4F7" stroke-opacity="0.32" stroke-width="10" stroke-linecap="round"/>
    <circle cx="168" cy="143" r="7" fill="#8CF7C7"/>
    <circle cx="194" cy="143" r="7" fill="#4EDAE7"/>
    <circle cx="220" cy="143" r="7" fill="#FFC857"/>
    <path d="M152 326V206L218 286L284 206V326" fill="none" stroke="url(#mp-mark)" stroke-linecap="round" stroke-linejoin="round" stroke-width="19"/>
    <path d="M340 204L318 332M386 204L364 332M301 248H399M293 298H391" fill="none" stroke="#FFC857" stroke-linecap="round" stroke-linejoin="round" stroke-width="13"/>
    <path d="M148 366H364" stroke="#D7E4F7" stroke-opacity="0.2" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
